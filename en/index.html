<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDMI</title>
    <link rel="icon" type="../RDMI.png" href="../RDMI.png">
    <style>
        body { /* reset body */
            margin: 0;
            padding: 0;
            font-family: "Times New Roman", Times, serif;
            background-color: #c8dad2;
        }

        .top-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background-color: #214133;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 100;
        }
        .main-content {
            padding-top: 70px;
            padding-inline: 10px;
            text-align: center;
            max-width: 1000px;
            margin: 0 auto;
        }
        .left-menu {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .right-menu {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .select {
            color: white;
            background-color: #305f4b;
            border: 0;
            width: 90px;
            height: 40px;
            padding: 5px;
        }
        .select option {
            padding: 10px;
            min-width: 200px;
        }
        .select option:hover {
            background-color: #305f4b;
            color: white;
        }
    </style>
</head>
<body>
    <div class="top-menu">
        <div class="left-menu">
            <img src="../RDMI.png" alt="logo" width="50">
            <h1>RDMI</h1>
        </div>
        <div class="right-menu">
            <select onchange="if(this.value) window.location.href=this.value;" class="select">
                <option value="" selected disabled hidden>Språk</option>
                <option value="../nn/index.html">Nynorsk</option>
                <option value="../nb/index.html">Bokmål</option>
            </select>
            <select onchange="if(this.value) window.location.href=this.value;" class="select">
                <option value="" selected disabled hidden>Resources</option>
                <option value="./res.html">Articles</option>
                <option value="./contact.html">Contact</option>
            </select>
        </div>
    </div>
    <div class="main-content">
        <h1>Rogaland Pigeon & Marine Bird Initiative</h1>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Sapiente provident voluptatem illo! Aperiam necessitatibus, officiis eos deleniti quasi aspernatur ex dolorum nostrum? Rerum nostrum adipisci optio, voluptates veritatis tempore nam.</p>
    </div>
</body>
</html>
